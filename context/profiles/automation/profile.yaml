title: Browser Automation
description: >-
  Agent-driven web browsing, validation and scraping: Lightpanda light
  (text-only, Chrome-free) browsing and PandaScript extraction, the
  Playwright escalation path for visual, cascade and screenshot work,
  rendering models, frontend validation (accessibility structure,
  functional testing, consistency and localization, visual system
  styles), and Chrome-free scraping patterns. Framework-agnostic:
  frontend-web consumers (the typescript module) and standalone
  scraping consumers both adopt it. It does not extend the design
  module: the validation references point to the design files they
  cite, and a consumer that writes interface code selects the design
  profiles itself.
packages:
  add:
    - browsing
    - web_validation
    - scraping
